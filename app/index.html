<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon-256.png" />
    <title>UltraGameStudio</title>
    <!-- Inter + JetBrains Mono are self-hosted (src/styles/fonts.css, fetched by
         scripts/fetch-fonts.mjs). No CDN request: this app must render the same
         offline, on an intranet, or behind a blocked network. -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const fallback = 'hermes-dark';
        const supported = new Set([
          'cherry-dark',
          'hermes-dark',
          'pencil',
          'cherry-light',
          'midnight',
          'aurora',
          'daylight',
          'ember',
          'campbell',
          'campbell-powershell',
          'one-half-dark',
          'solarized-dark',
          'terminal',
        ]);
        const locales = new Set([
          'zh-CN',
          'en-US',
          'fr-FR',
          'ru-RU',
          'es-ES',
          'hi-IN',
          'ar-SA',
          'pt-BR',
          'ja-JP',
          'de-DE',
          'ko-KR',
        ]);
        try {
          // <html lang> drives font selection, line breaking and screen-reader
          // pronunciation, so it must match the UI language before first paint.
          const storedLocale = localStorage.getItem('ultragamestudio.locale.v1');
          const lang =
            storedLocale && locales.has(storedLocale)
              ? storedLocale
              : navigator.language;
          if (lang) document.documentElement.lang = lang;
        } catch {
          // keep the markup default
        }
        try {
          const raw =
            localStorage.getItem('ultragamestudio.appearance.v1') ??
            localStorage.getItem('freeultracode.appearance.v1') ??
            localStorage.getItem('ultragamestudio.appearance.v1');
          const parsed = raw ? JSON.parse(raw) : null;
          const storedId =
            parsed && typeof parsed.stylePresetId === 'string'
              ? parsed.stylePresetId
              : fallback;
          const id = supported.has(storedId) ? storedId : fallback;
          document.documentElement.dataset.ugsStyle = id;
          document.documentElement.classList.add(`ugs-style-${id}`);
        } catch {
          document.documentElement.dataset.ugsStyle = fallback;
          document.documentElement.classList.add(`ugs-style-${fallback}`);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
